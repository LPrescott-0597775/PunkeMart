<!DOCTYPE html>
<html lang="en">
<head>
	<title>PunkeMart </title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="scripts/jquery-3.7.1.min.js"></script>
	<link rel="stylesheet" href="../assets/css/styles.css" />
	<link rel="stylesheet" href="../assets/css/images.css" />
	<link rel="stylesheet" href="../assets/css/shop.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div id="wrapper">
<header>

    <nav>
        <input title="check" type="checkbox" id="check">

        <label for="check" class="checkbtn">
            <i class="fas fa-bars"></i>
        </label>

        <div class="nav-mobile">
            <a href="../index.html">Home</a>
            <a href="shop.html">Shop</a>
			<a href="account.html">Account</a>
        </div>
    </nav>
	<h1>[REPLACE WITH IMAGE LOGO] Punk&egrave;Mart</h1>
	<div class = "cartButton"><a href="cart.html">[CART]</a></div>

</header>


<main>

	<div class="saleTextContainer">
	<p> <b>SALE:</b> Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
	</div>
	<!-- this will be replaced with a filter system later on -->
	<h2>Gear</h2>
		<section id="gear-list" class = "product-grid">
			<div class="product-card">
				<img class="shopImg" src="../assets/images/shop_PLACEHOLDER.png"></img>
				<label for="shirts">PLACEHOLDER A - $XX.XX each</label>
				<label for="shirtsQty"></label><input class = "number" type="number" min="1" value="1" id="qty-1">
				<button class="action-button primary-button" onclick="addToCart('001', 'PLACEHOLDER A', 10.00, document.getElementById('qty-1').value)">Add to Cart</button>
			</div>
		</section>
	<h2>Apparel</h2>
		<section id="apparel-list" class = "product-grid">
			<div class="product-card">
				<img class="shopImg" src="../assets/images/shop_PLACEHOLDER.png"></img>
				<label for="shirts">PLACEHOLDER APPAREL A - $XX.XX each</label><select id="size-1">
    																<option value="Small">Small</option>
    																<option value="Medium">Medium</option>
    																<option value="Large">Large</option>
    																<option value="X-Large">X-Large</option>
																				</select>
				<label for="shirtsQty"></label>
				<input
    				class="number"
    				type="number"
    				min="1"
    				value="1"
    				id="qty-2"
				>
				<button class="action-button primary-button" onclick="addToCart('002','PLACEHOLDER APPAREL A',25.00,
        			document.getElementById('qty-2').value,
        			document.getElementById('size-1').value)">Add to Cart
				</button>
			</div>
		</section>
</main>

</body>

</html>
